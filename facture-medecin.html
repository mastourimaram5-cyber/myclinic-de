<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Facture Consultation</title>
    <style>
        /* Style simple pour la facture */
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        .facture {
            background-color: white;
            padding: 20px;
            border: 2px solid #007bff;
            width: 400px;
            border-radius: 8px;
        }
        h2 {
            color: #007bff;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .total {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            text-align: right;
            color: green;
        }
    </style>
</head>
<body>

    <div class="facture">
        <h2>Facture de Consultation</h2>

        <!-- Informations Générales -->
        <p><strong>Médecin:</strong> Dr. Anis</p>
        <p><strong>Patient:</strong> Maram</p>
        <p><strong>Date:</strong> 10/11/2026</p>

        <!-- Tableau des prestations -->
        <table>
            <tr>
                <th>Service</th>
                <th>Prix</th>
            </tr>
            <tr>
                <td>Consultation médicale</td>
                <td>60 DT</td>
            </tr>
        </table>

        <!-- Total -->
        <p class="total">Total à payer: 60 DT</p>
    </div>

</body>
</html>
